---
repos:
  - repo: https://github.com/losisin/helm-values-schema-json
    rev: v2.1.0
    hooks:
      - id: helm-schema
        args:
          - --values=values.yaml
          - --output=values.schema.json
          - --use-helm-docs

  - repo: https://github.com/norwoodj/helm-docs
    rev:  v1.14.2
    hooks:
      - id: helm-docs
